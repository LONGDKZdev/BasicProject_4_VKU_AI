<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kho Chủ Đề Mẫu - StudySpace</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/toast.css}">

    <style>
        body {
            background-color: #fcf8f2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .store-card {
            background: #ffffff;
            border: 1px solid #eae2d8;
            border-radius: 18px;
            padding: 20px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .store-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border-color: #0d6efd;
        }

        .store-tag {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background-color: #f1f5f9;
            color: #475569;
        }

        .preview-table th {
            background-color: #f8fafc;
            font-size: 13px;
            font-weight: 700;
            color: #64748b;
        }

        .preview-table td {
            font-size: 14px;
            vertical-align: middle;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: main-nav}"></div>

    <div class="container py-4">
        <!-- Header Banner -->
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4 pb-2 border-bottom">
            <div>
                <h3 class="fw-bold text-dark m-0 d-flex align-items-center">
                    <i class="bx bx-store-alt text-primary me-2 fs-2"></i> Kho Chủ Đề Mẫu
                </h3>
                <p class="text-muted small m-0 mt-1">Các bộ từ vựng chuẩn được biên soạn sẵn. Bạn có thể xem trước và
                    lưu vào danh mục của mình.</p>
            </div>
            <div class="input-group" style="max-width: 320px;">
                <span class="input-group-text bg-white border-0 shadow-sm"><i
                        class="bx bx-search text-muted"></i></span>
                <input type="text" id="store-search" class="form-control bg-white border-0 shadow-sm"
                    placeholder="Tìm kiếm bộ từ vựng mẫu..." />
            </div>
        </div>

        <!-- Grid danh sách chủ đề mẫu -->
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="store-list">
            <!-- JavaScript sẽ render danh sách thẻ ở đây -->
        </div>
    </div>

    <!-- Modal Xem trước từ vựng (Preview) -->
    <div class="modal fade" id="previewModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 rounded-4 shadow"
                style="max-height: 85vh; display: flex; flex-direction: column;">
                <div class="modal-header border-bottom-0 pb-2">
                    <div>
                        <h5 class="modal-title fw-bold text-dark" id="preview-title">Xem trước chủ đề</h5>
                        <span class="text-muted small" id="preview-count">0 từ vựng</span>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0" style="overflow-y: auto; flex: 1;">
                    <table class="table table-hover preview-table m-0">
                        <thead>
                            <tr>
                                <th class="ps-4">Từ vựng (English)</th>
                                <th>Loại từ</th>
                                <th>Phiên âm</th>
                                <th>Nghĩa tiếng Việt</th>
                                <th class="pe-4">Ví dụ</th>
                            </tr>
                        </thead>
                        <tbody id="preview-tbody">
                            <!-- Danh sách từ render ở đây -->
                        </tbody>
                    </table>
                </div>
                <div class="modal-footer border-top-0 pt-3 px-4 d-flex justify-content-between">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4"
                        data-bs-dismiss="modal">Đóng</button>
                    <button type="button" id="btn-import-from-preview"
                        class="btn btn-primary rounded-pill px-4 fw-bold">
                        <i class="bx bx-download me-1"></i> Thêm vào bộ từ của tôi
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/toast.js}"></script>
    <script th:src="@{/js/navbar.js}"></script>
    <script th:src="@{/js/store.js}"></script>
</body>

</html>
