<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cài đặt tài khoản - Study Space</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
</head>
<body>
    <!-- Chèn Navbar -->
    <div th:replace="~{fragments/navbar :: main-nav}"></div>

    <div class="container mt-5 text-center">
        <div class="p-5 mb-4 bg-light rounded-4 shadow-sm">
            <i class="bx bx-cog text-secondary display-3 mb-3"></i>
            <h1 class="fw-bold">Cài đặt tài khoản</h1>
            <p class="text-muted">Nơi cấu hình thông tin cá nhân, mật khẩu và tuỳ chỉnh hệ thống.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/navbar.js}"></script>
</body>
</html>
