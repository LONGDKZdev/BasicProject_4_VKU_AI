<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cài đặt tài khoản - Study Space</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/settings.css}">
</head>
<body>
    <!-- Thanh tiêu đề thu gọn thay thế Navbar -->
    <div class="bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center shadow-sm">
        <h4 class="fw-bold m-0 d-flex align-items-center">
            <i class="bx bx-cog text-primary me-2"></i> Cài đặt hệ thống
        </h4>
        <a href="/" class="btn btn-outline-secondary rounded-pill fw-semibold d-flex align-items-center px-3">
            <i class="bx bx-arrow-back me-1"></i> Quay lại trang chủ
        </a>
    </div>

    <div class="settings-layout">
        <!-- Sidebar bên trái cho phần cài đặt -->
        <div class="settings-sidebar">
            <h6 class="fw-bold mb-3 text-secondary px-2 text-uppercase fs-7">Danh mục</h6>
            <div class="d-flex flex-column">
                <a href="#account" class="settings-nav-link active"><i class="bx bx-user-circle fs-5"></i> Quản lý tài khoản</a>
                <a href="#security" class="settings-nav-link"><i class="bx bx-lock fs-5"></i> Bảo mật & Mật khẩu</a>
                <a href="#preferences" class="settings-nav-link"><i class="bx bx-slider fs-5"></i> Tuỳ chỉnh giao diện</a>
            </div>
        </div>

        <!-- Nội dung chính bên phải -->
        <div class="settings-content">
            <div class="card border-0 shadow-sm rounded-4 p-4 max-w-lg bg-white" style="max-width: 600px;">
                <h3 class="fw-bold mb-3">Thông tin tài khoản</h3>
                <p class="text-muted mb-4">Quản lý thông tin cá nhân và định danh của bạn trên hệ thống.</p>
                
                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">Tên tài khoản (Username)</label>
                    <input type="text" class="form-control bg-light border-0" th:value="${#authentication.name}" readonly />
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small">Trạng thái bảo mật</label>
                    <input type="text" class="form-control bg-light border-0 text-success fw-semibold" value="Đã xác thực & Đang hoạt động" readonly />
                </div>
                <button class="btn btn-primary rounded-pill px-4 fw-bold">Lưu thay đổi</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
