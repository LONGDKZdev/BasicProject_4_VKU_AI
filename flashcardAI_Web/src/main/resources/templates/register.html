<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký tài khoản - Study Space</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card border-0 shadow rounded-4 p-4" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <i class="bx bxs-carousel text-primary" style="font-size: 48px;"></i>
            <h4 class="fw-bold mt-2">Study Space</h4>
            <p class="text-muted small">Tạo tài khoản mới để bắt đầu</p>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2 small text-center" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold small text-muted">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="bx bx-user"></i></span>
                    <input type="text" name="username" class="form-control bg-light border-0" placeholder="Nhập username..." required autofocus />
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small text-muted">Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="bx bx-envelope"></i></span>
                    <input type="email" name="email" class="form-control bg-light border-0" placeholder="Nhập địa chỉ email..." required />
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold small text-muted">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="bx bx-lock-alt"></i></span>
                    <input type="password" name="password" class="form-control bg-light border-0" placeholder="Nhập mật khẩu..." required />
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2 mb-3">
                Đăng ký
            </button>
            <div class="text-center small">
                <span class="text-muted">Đã có tài khoản?</span> <a th:href="@{/login}" class="text-primary fw-semibold">Đăng nhập ngay</a>
            </div>
        </form>
    </div>
</body>
</html>
