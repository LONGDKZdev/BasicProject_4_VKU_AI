<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Study Space</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card border-0 shadow rounded-4 p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <i class="bx bxs-carousel text-primary" style="font-size: 48px;"></i>
            <h4 class="fw-bold mt-2">Study Space</h4>
            <p class="text-muted small">Đăng nhập để tiếp tục học tập</p>
        </div>

        <!-- Hiển thị lỗi nếu đăng nhập sai -->
        <div th:if="${param.error}" class="alert alert-danger py-2 small text-center">
            Tên đăng nhập hoặc mật khẩu không chính xác!
        </div>
        <div th:if="${param.logout}" class="alert alert-success py-2 small text-center">
            Đăng xuất thành công!
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold small text-muted">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="bx bx-user"></i></span>
                    <input type="text" name="username" class="form-control bg-light border-0"
                        placeholder="Nhập username..." required autofocus />
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold small text-muted">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="bx bx-lock-alt"></i></span>
                    <input type="password" name="password" class="form-control bg-light border-0"
                        placeholder="Nhập mật khẩu..." required />
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2">
                Đăng nhập
            </button>
        </form>
    </div>
</body>

</html>
