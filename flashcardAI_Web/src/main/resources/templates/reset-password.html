<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - StudySpace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/toast.css}">
    <style>
        body {
            background: linear-gradient(135deg, #fcf8f2 0%, #eef2f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .reset-card {
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #eae2d8;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <div class="reset-card p-4 p-md-5">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary mb-1">StudySpace</h3>
            <p class="text-muted small">Thiết lập mật khẩu mới cho tài khoản của bạn</p>
        </div>

        <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Tài khoản</label>
            <input type="text" id="reset-username" class="form-control bg-light border-0 fw-bold" th:value="${username}" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Mật khẩu mới</label>
            <div class="input-group">
                <input type="password" id="new-password" class="form-control bg-light border-0" placeholder="Tối thiểu 6 ký tự...">
                <span class="password-toggle-btn" onclick="togglePasswordVisibility('new-password', this.querySelector('i'))">
                    <i class="bx bx-hide"></i>
                </span>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-muted small fw-semibold">Xác nhận mật khẩu mới</label>
            <div class="input-group">
                <input type="password" id="confirm-password" class="form-control bg-light border-0" placeholder="Nhập lại mật khẩu mới...">
                <span class="password-toggle-btn" onclick="togglePasswordVisibility('confirm-password', this.querySelector('i'))">
                    <i class="bx bx-hide"></i>
                </span>
            </div>
        </div>

        <button type="button" id="btn-submit-reset" class="btn btn-primary w-100 rounded-pill py-2 fw-bold mb-3">
            <i class="bx bx-check-shield me-1"></i> Lưu mật khẩu mới
        </button>

        <div class="text-center">
            <a href="/login" class="text-muted text-decoration-none small"><i class="bx bx-arrow-back me-1"></i>Quay lại Đăng nhập</a>
        </div>
    </div>

    <script th:src="@{/js/toast.js}"></script>
    <script th:src="@{/js/auth-helper.js}"></script>
    <script>
        document.getElementById('btn-submit-reset').addEventListener('click', async function () {
            const username = document.getElementById('reset-username').value.trim();
            const newPass = document.getElementById('new-password').value.trim();
            const confirmPass = document.getElementById('confirm-password').value.trim();

            if (!newPass || newPass.length < 6) {
                if (window.showToast) showToast("Mật khẩu mới phải từ 6 ký tự trở lên!", "warning");
                return;
            }

            if (newPass !== confirmPass) {
                if (window.showToast) showToast("Mật khẩu xác nhận không khớp!", "danger");
                return;
            }

            const btn = this;
            btn.disabled = true;
            btn.innerHTML = `<i class="bx bx-loader-alt bx-spin me-1"></i> Đang cập nhật...`;

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, newPassword: newPass })
                });

                const msg = await res.text();
                if (res.ok) {
                    if (window.showToast) showToast("Đổi mật khẩu thành công! Đang chuyển hướng...", "success");
                    setTimeout(() => window.location.href = '/login', 1500);
                } else {
                    if (window.showToast) showToast(msg || "Cập nhật mật khẩu thất bại!", "danger");
                    btn.disabled = false;
                    btn.innerHTML = `<i class="bx bx-check-shield me-1"></i> Lưu mật khẩu mới`;
                }
            } catch (e) {
                if (window.showToast) showToast("Lỗi kết nối máy chủ!", "danger");
                btn.disabled = false;
                btn.innerHTML = `<i class="bx bx-check-shield me-1"></i> Lưu mật khẩu mới`;
            }
        });
    </script>
    
</body>
</html>
