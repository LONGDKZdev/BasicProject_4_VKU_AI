<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat AI & Machine Learning - Study Space</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/chat-ai.css}">
    <link rel="stylesheet" th:href="@{/css/toast.css}">
</head>

<body>
    <div th:replace="~{fragments/navbar :: main-nav}"></div>

    <div class="chat-layout">
        <!-- Sidebar trái: Lịch sử chat có menu 3 chấm -->
        <div class="chat-sidebar">
            <button class="new-chat-btn"><i class="bx bx-plus"></i> Đoạn chat mới</button>
            <div class="history-list" id="historyList">
                <!-- Dữ liệu lịch sử sẽ render ở đây -->
                <div class="history-item-wrapper">
                    <div class="history-item">Phân tích từ vựng tiếng Anh giao tiếp</div>
                    <div class="dropdown-action">
                        <i class="bx bx-dots-vertical-rounded action-toggle"></i>
                        <div class="action-menu">
                            <button class="rename-btn"><i class="bx bx-edit"></i> Đổi tên</button>
                            <button class="delete-btn"><i class="bx bx-trash"></i> Xóa</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Khung chat chính -->
        <div class="chat-main">
            <!-- Màn hình chào mừng kiểu Gemini (hiện khi chưa có tin nhắn hoặc ở đoạn chat mới) -->
            <div class="welcome-screen" id="welcomeScreen">
                <h2 class="fw-normal text-dark">Chào <span th:text="${#authentication.name}">Long</span>, tôi có thể
                    giúp gì cho bạn?</h2>
            </div>

            <div class="chat-messages d-none" id="chatMessages"></div>

            <!-- Ô nhập liệu và tuỳ chọn -->
            <div class="chat-input-area">
                <div class="input-box-wrapper">
                    <textarea class="chat-textarea" id="chatInput" rows="1"
                        placeholder="Hỏi Gemini hoặc dán JSON cập nhật từ vựng..."></textarea>
                    <div class="chat-bottom-bar">
                        <select class="model-select" id="modelSelect">
                            <option value="gemini">🤖 Chat bot</option>
                            <option value="ai-personal">🧠 Chat bot Personal</option>
                        </select>
                        <div class="send-action-group">
                            <button class="json-btn" title="Dán dữ liệu JSON"><i class="bx bx-code-alt"></i>
                                JSON</button>
                            <button class="send-btn" id="sendBtn"><i class="bx bx-up-arrow-alt"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal Xác nhận xóa đoạn chat -->
    <div class="modal fade" id="confirmChatModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-bottom-0 pt-4 px-4 pb-0">
                    <h5 class="modal-title fw-bold text-dark">
                        <i class="bx bx-error-circle text-danger me-2"></i>Xác nhận
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body px-4 py-3 text-secondary fw-semibold">
                    Bạn có chắc chắn muốn xóa đoạn chat này?
                </div>
                <div class="modal-footer border-top-0 pb-4 px-4 d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-light fw-bold px-4 rounded-3"
                        data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-danger fw-bold px-4 rounded-3" id="btnConfirmDeleteChat">Đồng
                        ý</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Đổi tên đoạn chat -->
    <div class="modal fade" id="renameChatModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-bottom-0 pt-4 px-4 pb-0">
                    <h5 class="modal-title fw-bold text-dark">
                        <i class="bx bx-edit text-primary me-2"></i>Đổi tên
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body px-4 py-3">
                    <label class="form-label text-muted small fw-semibold">Nhập tiêu đề mới:</label>
                    <input type="text" id="renameChatInput" class="form-control bg-light border-0" />
                </div>
                <div class="modal-footer border-top-0 pb-4 px-4 d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-light fw-bold px-3 rounded-3"
                        data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary fw-bold px-3 rounded-3"
                        id="btnConfirmRenameChat">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/navbar.js}"></script>
    <script th:src="@{/js/chat-ai.js}"></script>
    <script th:src="@{/js/toast.js}"></script>

</body>

</html>
