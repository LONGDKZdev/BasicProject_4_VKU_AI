<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="main-nav">
        <header class="custom-navbar">
            <!-- Khối 1: Logo -->
            <div class="nav-logo">
                <a href="/">
                    <span class="logo-text">StudySpace</span>
                </a>
            </div>

            <!-- Khối 2: Menu giữa -->
            <nav class="nav-menu">
                <a href="/" class="nav-item">Trang chủ</a>
                <a href="/chat-ai" class="nav-item">ChatAI</a>
                <a href="/meet" class="nav-item">Meet</a>
            </nav>

            <!-- Khối 3: Tài khoản (Avatar Emoji + Bánh răng Dropdown) -->
            <div class="nav-account">
                <div class="account-dropdown-toggle" id="accountDropdownBtn" title="Tài khoản">
                    <div id="nav-avatar-icon" class="nav-avatar-circle">🦊</div>
                    <i class="bx bx-cog nav-gear-icon"></i>
                </div>
                <div class="account-dropdown-menu" id="accountDropdownMenu">
                    <div class="px-3 py-2 border-bottom mb-1">
                        <span class="d-block fw-bold text-dark text-truncate" id="nav-username-display" th:text="${#authentication.name}">User</span>
                        <span class="d-block text-muted small">Học viên</span>
                    </div>
                    <a href="/settings" class="dropdown-item"><i class="bx bx-slider-alt me-2 text-primary"></i> Cài đặt</a>
                    <div class="dropdown-divider"></div>
                    <form th:action="@{/logout}" method="post" style="margin: 0;">
                        <button type="submit" class="dropdown-item logout-btn"><i class="bx bx-log-out me-2"></i> Đăng xuất</button>
                    </form>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
